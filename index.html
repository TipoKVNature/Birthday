<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f15a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Маленькое приглашение ♡</title>
  <style>
    :root{color-scheme:light;--coral:#f15a3d;--peach:#ff9876;--cream:#fff5df;--ink:#71372d;--white:#fffaf0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white)}
    body{min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 47% 48%,#ff8456 0,#fa6844 37%,#ec503b 75%,#e84837 100%);display:grid;place-items:center;padding:24px 16px;position:relative}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#fff 0.65px,transparent .65px);background-size:17px 17px;mask-image:linear-gradient(transparent,#000 20%,#000 85%,transparent)}
    .floaties{position:fixed;inset:0;overflow:hidden;pointer-events:none}.float{position:absolute;color:#ffd3a7;opacity:.55;animation:drift linear infinite;font-size:clamp(16px,3vw,27px);filter:drop-shadow(0 2px 4px #ce503644)}
    @keyframes drift{0%{transform:translateY(110vh) rotate(-20deg);opacity:0}15%{opacity:.5}90%{opacity:.4}100%{transform:translateY(-12vh) rotate(35deg);opacity:0}}
    .shell{width:min(100%,440px);position:relative;z-index:1}.card{border:1px solid #ffe2bc77;background:linear-gradient(145deg,#ff9d7bed,#ff8969f0);border-radius:30px;padding:22px 25px 25px;box-shadow:0 24px 60px #98301c45,inset 0 1px #fff7;backdrop-filter:blur(9px);text-align:center;min-height:535px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:transform .35s,opacity .35s}
    .card.leaving{opacity:0;transform:translateY(12px) scale(.985)}.progress{display:flex;gap:7px;margin:0 auto 10px}.pip{width:25px;height:5px;border-radius:9px;background:#ffe5ce80;transition:all .3s}.pip.active{background:#fff6e4;width:37px}
    .mascot{height:170px;width:210px;display:grid;place-items:center;margin:2px auto 8px;animation:mascotBob 3.1s ease-in-out infinite}.mascot svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 3px #bd47202c)}
    @keyframes mascotBob{0%,100%{transform:translateY(2px) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
    h1{font-size:clamp(27px,7vw,34px);line-height:1.13;margin:7px 0 9px;letter-spacing:-.8px;color:#fff9ed;text-shadow:0 2px 0 #e76d5060;font-weight:850}p{margin:0;color:#fff1dc;font-size:15px}.question{font-weight:700;font-size:clamp(25px,6.5vw,32px);line-height:1.17;margin:11px 0 8px}.sub{font-size:14px;opacity:.86;margin:0 0 20px}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:17px;flex-wrap:wrap}.btn{appearance:none;border:0;border-radius:999px;padding:14px 24px;font:750 16px inherit;font-size:16px;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s;min-height:49px;touch-action:manipulation}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #a9422760}.btn:active{transform:scale(.97)}.primary{background:var(--cream);color:#8d4635;box-shadow:0 5px 12px #a9422740}.secondary{background:#ffb09490;color:#fff8e8;border:1px solid #ffe0c866}.quiet{background:transparent;color:#fff5e2;text-decoration:underline;text-underline-offset:4px;padding:9px 12px;min-height:auto;font-size:14px}
    .form{width:100%;display:grid;gap:11px;text-align:left;margin-top:3px}.field-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin:0 2px -5px;color:#fff2dc}.input{width:100%;border:1px solid #fff2dca8;background:#ffad8b99;border-radius:17px;min-height:56px;padding:0 17px;color:white;font-size:17px;font-family:inherit;outline:none;accent-color:#fff0d3}.input:focus{box-shadow:0 0 0 3px #fff4df60;border-color:#fff4df}.input::-webkit-calendar-picker-indicator{filter:brightness(0) invert(1);cursor:pointer}.input option{color:#71372d}
    .activity-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1px}.activity{border:1px solid #fff1d680;background:#ffb18c78;border-radius:19px;color:#fffaf0;min-height:112px;font:inherit;cursor:pointer;display:grid;place-items:center;align-content:center;gap:3px;transition:transform .22s,background .22s,box-shadow .22s;touch-action:manipulation;position:relative;overflow:hidden}.activity:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 10px 23px #9a3d2840}.activity .emoji{font-size:33px;line-height:1.25;transition:transform .3s}.activity:hover .emoji{transform:scale(1.2) rotate(8deg)}.activity .label{font-weight:750;font-size:14px}.activity[aria-pressed="true"]{background:#fff1dce8;color:#8c4434;border-color:#fff9ec;transform:translateY(-2px);box-shadow:0 7px 15px #9a3d2840}.activity:active{transform:scale(.98)}
    .summary{width:100%;background:#ffb18c66;border:1px solid #fff1dc80;border-radius:18px;padding:16px 14px;margin:9px 0;color:#fff8e9;line-height:1.6}.summary strong{color:#fff}
    .toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;background:#fff4df;color:#854337;border-radius:100px;padding:12px 18px;z-index:3;font-weight:750;box-shadow:0 8px 25px #8f301e55;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .confetti{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}.confetti i{position:absolute;top:-15px;width:9px;height:13px;border-radius:3px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(620deg);opacity:.1}}
    .heart-burst{position:fixed;z-index:6;pointer-events:none;font-size:19px;animation:heartBurst .85s ease-out forwards;filter:drop-shadow(0 3px 4px #a3443b55)}@keyframes heartBurst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.15);opacity:0}}
    #no{white-space:nowrap;will-change:left,top;transition:left .24s cubic-bezier(.2,.8,.2,1),top .24s cubic-bezier(.2,.8,.2,1),transform .16s,box-shadow .16s}.no-escaped{position:fixed!important;z-index:8!important;margin:0!important}
    @media(max-width:390px){body{padding:14px 12px}.card{padding:17px 17px 20px;min-height:500px;border-radius:25px}.mascot{height:145px}.activity{min-height:100px}.question{font-size:26px}}
    @media(min-height:850px){.card{min-height:565px;justify-content:center}.mascot{height:185px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="floaties" aria-hidden="true" id="floaties"></div>
  <main class="shell"><section class="card" id="card" aria-live="polite"></section></main>
  <div class="toast" id="toast" role="status"></div><div class="confetti" id="confetti" aria-hidden="true"></div>
  <script>
    const card=document.querySelector('#card'),toast=document.querySelector('#toast'),ownerMode=new URLSearchParams(location.search).has('owner');let step=0,chosen=[],transitioning=false,lastPointer={x:innerWidth/2,y:innerHeight/2},pushStatus='';
    const art=(kind='couple')=>{
      const tail='<path d="M89 130c-18 5-18 25-5 24 7-1 7-8 2-10" fill="none" stroke="#725047" stroke-width="4" stroke-linecap="round"/>';
      const cat=(x,y,s,fill,face='happy')=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="#75554a" stroke-width="3.2" stroke-linejoin="round"><path d="M9 34 12 8l21 15L53 8l5 29c15 17 12 49 2 62-9 10-42 10-51 0C-1 88-4 53 9 34Z" fill="${fill}"/><ellipse cx="20" cy="52" rx="3.2" ry="4.6" fill="#503c39" stroke="none"/><ellipse cx="46" cy="52" rx="3.2" ry="4.6" fill="#503c39" stroke="none"/><ellipse cx="12" cy="62" rx="6" ry="3.5" fill="#f58b83" stroke="none" opacity=".8"/><ellipse cx="54" cy="62" rx="6" ry="3.5" fill="#f58b83" stroke="none" opacity=".8"/><path d="M30 62q3 4 6 0m-3 0v4m-6 2q6 7 12 0" fill="none" stroke="#75554a" stroke-width="2.4" stroke-linecap="round"/><path d="M18 98q-4 12 2 17m25-17q4 12-2 17" fill="none" stroke="#75554a" stroke-width="3.2" stroke-linecap="round"/><path d="M16 83q8-8 16 0t16 0" fill="none" stroke="#75554a" stroke-width="3" stroke-linecap="round"/>${face==='kiss'?'<path d="M17 51q5-7 10 0m13 0q5-7 10 0" fill="none" stroke="#75554a" stroke-width="2.4"/>':''}</g>`;
      let extras='';if(kind==='date') extras='<path d="M144 37c-8-10-23 2 0 18 23-16 8-28 0-18Z" fill="#f55453"/><path d="M43 28c-5-7-15 1 0 12 15-11 5-19 0-12Z" fill="#ffd4aa"/>';
      if(kind==='calendar') extras='<path d="m144 28 8 15 17 2-13 11 4 17-16-9-15 9 3-17-12-11 17-2Z" fill="#ffd778" stroke="#95624b" stroke-width="2"/>';
      if(kind==='activity') extras='<path d="M137 31c-8-10-23 2 0 18 23-16 8-28 0-18Z" fill="#f55453"/><circle cx="37" cy="30" r="5" fill="#ffdf83"/><circle cx="170" cy="71" r="4" fill="#fff0d0"/>';
      return `<svg viewBox="0 0 210 170" role="img" aria-label="Милые мультяшные котики">${extras}${kind==='calendar'?cat(70,30,.9,'#f1c6a5'):kind==='solo'?cat(72,25,1,'#efc9a9'):cat(42,35,.83,'#e9c1a2')+cat(93,45,.76,'#fff0d9')}${kind==='couple'||kind==='date'?'<path d="M115 133q10 7 20 0" fill="none" stroke="#a65b45" stroke-width="2"/>':''}<ellipse cx="105" cy="155" rx="36" ry="4" fill="#a5442e" opacity=".14"/></svg>`;
    };
    const progress=()=>`<div class="progress" aria-label="Шаг ${step+1} из 3">${[0,1,2].map((n)=>`<span class="pip ${n<=step?'active':''}"></span>`).join('')}</div>`;
    function render(){card.classList.remove('leaving');if(ownerMode){card.innerHTML=ownerSetup();return}card.innerHTML=progress()+ (step===0?welcome():step===1?dateForm():step===2?activities():finale());if(step===0){const no=document.querySelector('#no');no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')escapeNo(no,e.clientX,e.clientY)});no.addEventListener('pointerdown',e=>{lastPointer={x:e.clientX,y:e.clientY};e.preventDefault();escapeNo(no,e.clientX,e.clientY)},{passive:false});no.addEventListener('click',e=>{e.preventDefault();escapeNo(no,lastPointer.x,lastPointer.y)})}if(step===1){const d=document.querySelector('#date');const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());d.min=today.toISOString().slice(0,10);d.value=sessionStorage.getItem('date')||'';document.querySelector('#time').value=sessionStorage.getItem('time')||''}if(step===2){document.querySelectorAll('.activity').forEach(b=>b.setAttribute('aria-pressed',String(chosen.includes(b.dataset.id))))}}
    function welcome(){return `<div class="mascot">${art('couple')}</div><h1 class="question">Пойдёшь со мной<br>на свидание? 💌</h1><p>У меня есть одна идея…</p><div class="actions"><button class="btn primary" id="yes">Да! 🥰</button><button class="btn secondary" id="no" aria-label="Нет, кнопка всё время убегает">Нет 🙈</button></div><button class="btn quiet" id="maybe">Расскажи подробнее</button><a class="btn quiet" href="/?owner=1" style="font-size:11px;opacity:.7;margin-top:3px">🔔 Настройка уведомлений владельцу</a>`}
    function dateForm(){return `<div class="mascot">${art('calendar')}</div><h1 class="question">Когда тебе удобно? 🗓️</h1><p class="sub">Выберем день и время вместе</p><div class="form"><label class="field-label" for="date">День</label><input class="input" id="date" type="date" required><label class="field-label" for="time">Время</label><input class="input" id="time" type="time" required></div><div class="actions"><button class="btn primary" id="next">Подтвердить →</button><button class="btn quiet" id="back">← Назад</button></div>`}
    function activities(){return `<div class="mascot" style="height:145px">${art('activity')}</div><h1 class="question">Чем займёмся? 😊</h1><p class="sub">Выбери один вариант по душе</p><div class="activity-grid">${[['pizza','🍕','Пицца'],['movie','🎬','Кино'],['games','🎮','Игры'],['adult','🔥','18+']].map(([id,emoji,label])=>`<button class="activity" data-id="${id}" aria-pressed="false"><span class="emoji">${emoji}</span><span class="label">${label}</span></button>`).join('')}</div><div class="actions"><button class="btn primary" id="next">Дальше →</button><button class="btn quiet" id="back">← Назад</button></div>`}
    function finale(){const names={pizza:'🍕 Пицца',movie:'🎬 Кино',games:'🎮 Игры',adult:'🔥 18+'}, date=sessionStorage.getItem('date'),time=sessionStorage.getItem('time');let day=date?new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'день выберем вместе';return `<div class="mascot">${art('date')}</div><h1 class="question">Ура, это будет<br>особенный день! 💖</h1><p>Наш план уже почти готов</p><div class="summary">📅 <strong>${day}</strong>${time?' · '+time:''}<br>✨ <strong>${chosen.map(x=>names[x]).join(' и ')||'Сюрприз!'}</strong></div><p>Буду ждать с нетерпением 🐾</p><p class="footnote" id="pushStatus">${pushStatus||'Отправляю уведомление…'}</p><div class="actions"><button class="btn primary" id="restart">Начать сначала ↺</button></div>`}
    function newTopic(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return 'date-invite-'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
    function currentTopic(){let topic=localStorage.getItem('notifyTopic');if(!topic){topic=newTopic();localStorage.setItem('notifyTopic',topic)}return topic}
    function ownerSetup(){return `<div class="mascot">${art('solo')}</div><h1 class="question">Уведомления владельцу 🔔</h1><p class="sub">Настрой их один раз до отправки приглашения</p><div class="summary" style="text-align:left">1. Установи <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noreferrer" style="color:#fff;text-decoration:underline">ntfy из App Store</a> и подпишись на тему ниже.<br>2. На Cloudflare Pages открой Settings → Variables and Secrets и добавь переменную <strong>NTFY_TOPIC</strong> с таким же значением.<br>3. После публикации сайта уведомление придёт в ntfy.</div><p class="field-label" style="align-self:flex-start;margin:4px 2px 2px">Твоя приватная тема</p><div class="summary" style="display:flex;align-items:center;gap:8px;overflow-wrap:anywhere"><code id="topicValue" style="font-size:12px;flex:1">${currentTopic()}</code><button class="btn secondary" id="copyTopic" style="padding:9px 12px;min-height:40px;font-size:13px">Скопировать</button></div><p class="footnote" id="ownerStatus">Тема хранится на этом устройстве. Не публикуй её.</p><div class="actions"><button class="btn secondary" id="regenerateTopic">Создать новую тему</button><a class="btn quiet" href="/">Вернуться к приглашению</a></div>`}
    function escapeNo(button,x,y){const rect=button.getBoundingClientRect(),pad=14,maxX=Math.max(pad,innerWidth-rect.width-pad),maxY=Math.max(pad,innerHeight-rect.height-pad),minDistance=Math.min(115,Math.min(innerWidth,innerHeight)*.3);let nx=pad,ny=pad;for(let i=0;i<28;i++){const tx=pad+Math.random()*(maxX-pad),ty=pad+Math.random()*(maxY-pad);nx=tx;ny=ty;if(Math.hypot(tx+rect.width/2-x,ty+rect.height/2-y)>minDistance)break}button.classList.add('no-escaped');button.style.left=`${Math.round(nx)}px`;button.style.top=`${Math.round(ny)}px`;button.animate([{transform:'scale(.86) rotate(-5deg)'},{transform:'scale(1.08) rotate(4deg)'},{transform:'scale(1) rotate(0)'}],{duration:260,easing:'ease-out'})}
    function burstHearts(x,y,count=8){const symbols=['♡','♥','💖','✨'];for(let i=0;i<count;i++){const h=document.createElement('span');h.className='heart-burst';h.textContent=symbols[i%symbols.length];h.style.left=`${x}px`;h.style.top=`${y}px`;h.style.setProperty('--dx',`${Math.round((Math.random()-.5)*130)}px`);h.style.setProperty('--dy',`${Math.round(-35-Math.random()*100)}px`);h.style.setProperty('--rot',`${Math.round((Math.random()-.5)*70)}deg`);document.body.append(h);setTimeout(()=>h.remove(),900)}}
    function next(){if(transitioning)return;transitioning=true;card.classList.add('leaving');setTimeout(()=>{step++;render();transitioning=false;window.scrollTo({top:0,behavior:'smooth'});if(step===3)sendChoiceNotification()},220)}
    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400)}
    function celebrate(){const layer=document.querySelector('#confetti');layer.innerHTML='';for(let i=0;i<70;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'%';el.style.animationDelay=Math.random()*.6+'s';el.style.background=['#ffe7a8','#fff4dc','#fb7054','#ffc4a4','#f9d069'][i%5];el.style.transform=`rotate(${Math.random()*180}deg)`;layer.append(el)}setTimeout(()=>layer.innerHTML='',3400)}
    function b64ToBytes(value){const normalized=value.replace(/-/g,'+').replace(/_/g,'/'),raw=atob(normalized);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
    async function copyTopic(){const status=document.querySelector('#ownerStatus');try{await navigator.clipboard.writeText(currentTopic());status.textContent='Скопировано. Вставь эту тему в ntfy и в переменную NTFY_TOPIC на Cloudflare.'}catch{status.textContent='Выдели и скопируй тему вручную.'}}
    async function sendChoiceNotification(){const status=document.querySelector('#pushStatus'),names={pizza:'Пицца',movie:'Кино',games:'Игры','adult':'18+'},payload={date:sessionStorage.getItem('date'),time:sessionStorage.getItem('time'),activity:names[chosen[0]]};try{const result=await fetch('/api/choice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!result.ok)throw new Error('Сервис уведомлений пока не подключён');const body=await result.json();pushStatus=body.sent?'Уведомление отправлено владельцу 💌':'Настрой уведомления владельца перед отправкой ссылки';if(status)status.textContent=pushStatus}catch{pushStatus='Push заработает после публикации сайта и настройки темы';if(status)status.textContent=pushStatus}}
    card.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='yes'){burstHearts(innerWidth/2,innerHeight/2,15);next()}else if(t.id==='no'){e.preventDefault();escapeNo(t,lastPointer.x,lastPointer.y)}else if(t.id==='maybe'){showToast('Будет уютно, мило и только так, как тебе комфортно ♡')}else if(t.id==='back'){step--;render()}else if(t.id==='next'){if(step===1){const date=document.querySelector('#date').value,time=document.querySelector('#time').value;if(!date||!time){showToast('Выбери, пожалуйста, день и время ✨');(!date?document.querySelector('#date'):document.querySelector('#time')).focus();return}sessionStorage.setItem('date',date);sessionStorage.setItem('time',time);next()}else if(step===2){if(!chosen.length){showToast('Выбери один вариант 😊');return}next()}}else if(t.classList.contains('activity')){const id=t.dataset.id;chosen=[id];document.querySelectorAll('.activity').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const r=t.getBoundingClientRect();burstHearts(r.left+r.width/2,r.top+r.height/2,7)}else if(t.id==='copyTopic'){copyTopic()}else if(t.id==='regenerateTopic'){const topic=newTopic();localStorage.setItem('notifyTopic',topic);document.querySelector('#topicValue').textContent=topic;document.querySelector('#ownerStatus').textContent='Создана новая тема. Обнови такую же переменную на Cloudflare и подписку в ntfy.'}else if(t.id==='restart'){step=0;chosen=[];pushStatus='';sessionStorage.removeItem('date');sessionStorage.removeItem('time');render()}});
    // Trigger celebration on the transition into the final screen.
    const observer=new MutationObserver(()=>{if(step===3)celebrate()});observer.observe(card,{childList:true});
    const floaties=document.querySelector('#floaties');for(let i=0;i<32;i++){const f=document.createElement('span');f.className='float';f.textContent=['♡','✦','♥','✿','💗','⋆'][i%6];f.style.left=Math.random()*100+'%';f.style.animationDuration=(9+Math.random()*17)+'s';f.style.animationDelay=(-Math.random()*22)+'s';f.style.fontSize=(13+Math.random()*20)+'px';floaties.append(f)}
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
    render();
  </script>
</body>
</html>
